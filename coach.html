<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vitesse barre">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{-webkit-text-size-adjust:100%}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}</style>
</head>
<body>
<title>Espace coach</title>
<link rel="icon" type="image/svg+xml" href="img/logo.svg">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: une colonne de poche, comme le minuteur : réglages, prise de vue, puis la série répétition par répétition. */
:root{
  /* Charte QRP : bleu nuit, bleu électrique, blanc cassé, orange pour les moments clés */
  --bg:#0B1220; --surface:#111A2E; --sunk:#18233B; --fg:#F5F7FA; --muted:#9AA5B1; --line:#22304A;
  --accent:#2E7CF6; --hot:#FF6B35; --ok:#2FC08F; --warn:#F2B23A; --bad:#FF6B35;
  --display:"Montserrat",system-ui,sans-serif;
  --body:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:600px;margin:0 auto;padding-block:16px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:30px;margin:0;text-transform:uppercase;letter-spacing:.01em;line-height:1}
h2{font-family:var(--display);font-weight:600;font-size:20px;text-transform:uppercase;letter-spacing:.03em;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:10px 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
button:focus-visible,.btn:focus-within,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
.chips button{padding:8px 13px;border-radius:99px;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field input,.field select{font:inherit;padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--sunk);color:var(--fg);width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 auto}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions .big{grid-column:1/-1;font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.03em;padding:14px}
.btn input{display:none}
.note{font-size:13px;color:var(--muted);margin:0}
.warnbox{font-size:13px;border-left:3px solid var(--warn);padding:8px 10px;background:var(--sunk);border-radius:0 8px 8px 0;margin:0}

.stage{position:relative;border-radius:12px;overflow:hidden;background:#000;touch-action:manipulation}
.stage canvas{display:block;width:100%;height:auto}
.stage video{position:absolute;inset:0;width:100%;height:100%;opacity:.01;pointer-events:none}
.hint{font-weight:600}
.col{display:flex;flex-direction:column;gap:12px}
.stepper{display:grid;grid-template-columns:44px 1fr 44px;gap:6px}
.stepper button{padding:8px 0;font-size:20px}
.stepper input{text-align:center;font-weight:700}
.sets{display:flex;flex-direction:column;gap:6px}
.setrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--sunk);font-variant-numeric:tabular-nums}
.setrow .k{font-family:var(--display);font-weight:700;font-size:18px;color:var(--muted)}
.setrow .m{font-size:14px}
.setrow .l{font-weight:700}
.setrow.todo{opacity:.55}
.setrow.cur{outline:2px solid var(--accent)}
.lossok{color:var(--ok)}.lossbad{color:var(--bad)}
.banner{position:absolute;left:8px;right:8px;bottom:8px;padding:12px 12px;border-radius:10px;font-weight:700;font-size:clamp(16px,4.8vw,22px);text-align:center;color:#fff;background:rgba(20,27,32,.78);transition:background .25s}
.stage.mirror canvas{transform:scaleX(-1)}
.stage{outline:0 solid transparent;transition:outline-color .2s}
.stage.locked{outline:6px solid #13a35a;outline-offset:-6px}
.stage.lost{outline:6px solid #cf3d1c;outline-offset:-6px}
.banner.hold{background:rgba(182,123,5,.92)}
.banner.go{background:#13a35a;box-shadow:0 0 0 3px rgba(19,163,90,.35),0 0 24px rgba(53,224,138,.7)}
.banner.bad{background:rgba(207,61,28,.92)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:8px 12px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
progress{width:100%;height:8px;accent-color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}

.livebig{font-family:var(--display);font-weight:700;font-size:72px;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.livebig small{font-size:22px;color:var(--muted);font-weight:500}

.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:420px){.sum{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--sunk);border-radius:10px;padding:8px 10px;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.badge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.badge.demo{background:var(--warn);color:#1a1200}
.reps{display:flex;flex-direction:column;gap:6px}
.rep{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--sunk);border-left:4px solid var(--muted)}
.rep.ok{border-left-color:var(--ok)}.rep.warn{border-left-color:var(--warn)}.rep.bad{border-left-color:var(--bad)}
.rep .n{font-family:var(--display);font-size:20px;font-weight:700;color:var(--muted)}
.rep .v{font-family:var(--display);font-size:28px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.rep .v small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:500;margin-left:4px}
.rep .bar{height:6px;border-radius:3px;background:var(--line);margin-top:5px;overflow:hidden}
.rep .bar i{display:block;height:100%;background:var(--accent)}
.rep .det{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;line-height:1.35}
.chart{width:100%;height:auto;display:block;border-radius:10px;background:var(--sunk)}
.hist{display:flex;flex-direction:column;gap:6px}
.hrow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 10px;background:var(--sunk);border-radius:10px;font-size:14px;font-variant-numeric:tabular-nums;cursor:pointer;text-align:left;border:0;width:100%;font-weight:400}
.hrow b{font-weight:600}
details summary{cursor:pointer;font-weight:600}
details ol,details ul{padding-left:20px;margin:8px 0 0;display:flex;flex-direction:column;gap:6px;font-size:14px}
/* Charte QRP : Montserrat ExtraBold pour les titres, sobre et premium */
h1{font-weight:800;font-size:24px;text-transform:none;letter-spacing:-.01em}
h2{font-weight:800;font-size:17px;text-transform:none;letter-spacing:0}
.topnav h1{font-size:19px}
.lbl,.stat span,.badge,.ptab th{font-weight:700;letter-spacing:.08em}
.actions .big,.big{font-weight:800;font-size:17px;text-transform:none;letter-spacing:.01em}
.tile b,.pcard .ph b{font-weight:800;font-size:16px;text-transform:none;letter-spacing:0}
.verdict b{font-weight:800;font-size:22px;text-transform:none}
.stat b,.rep .v,.pcard .rm,.livebig{font-weight:800;letter-spacing:-.02em}
.stat b{font-size:24px} .rep .v{font-size:24px} .livebig{font-size:64px}
.setrow .k,.sdset .k,.rep .n,.ptrow .top .k{font-weight:800}
.card{border-radius:16px;border-color:var(--line);box-shadow:0 1px 0 rgba(255,255,255,.03) inset}
button,.btn{border-radius:12px;background:var(--sunk);border-color:var(--line)}
.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 8px 24px rgba(46,124,246,.25)}
.tile{background:var(--surface);border-color:var(--line);border-radius:16px}
.tile.main{background:radial-gradient(120% 140% at 100% 0%,#3a8bff 0%,#2E7CF6 45%,#1f5fd0 100%);border-color:#2E7CF6;box-shadow:0 12px 32px rgba(46,124,246,.3)}
.tile.form{border-color:var(--line);border-left:3px solid var(--hot)}
.hlogo{border-radius:12px}
.chips button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.lossbad{color:var(--hot)}
.wk{font-weight:800;font-size:15px;text-transform:none;letter-spacing:0}
.code{font-weight:800}
</style>
<style>
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.week{display:flex;flex-direction:column;gap:8px}
.wk{font-family:var(--display);font-size:18px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-top:6px}
.sess{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.sess h3{margin:0;font-size:15px}
.fdot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--muted);vertical-align:middle}
.fdot.ok{background:var(--ok)}.fdot.warn{background:var(--warn)}.fdot.bad{background:var(--bad)}
.fdots{display:inline-flex;gap:4px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.tblwrap{overflow-x:auto}
.bad{color:var(--bad);font-weight:700}.ok{color:var(--ok);font-weight:700}
.exrow{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:6px;align-items:end}
@media (max-width:480px){.exrow{grid-template-columns:1fr 1fr 1fr;}.exrow .field:first-child{grid-column:1/-1}}
.code{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:.12em}
.spark{width:100%;height:auto;display:block}
video{width:100%;border-radius:10px;background:#000}
.small{padding:6px 10px;font-size:13px}
</style>
<div class="wrap">
  <header><h1>Espace coach</h1><a class="sub" href="./">Retour à l'app</a></header>
  <section class="card" id="main"><p class="note">Chargement…</p></section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="config.js?v=4"></script>
<script>

  jsquat:{name:"Squat sauté",cat:"Bas du corps",rom:0.20,metric:"mcv",ecc:true},
  tbj:{name:"Trap bar jump",cat:"Bas du corps",rom:0.20,metric:"mcv",ecc:true,jump:true},
  hip:{name:"Hip thrust",cat:"Bas du corps",rom:0.07,metric:"mcv",mvt:0.25},
  rdl:{name:"RDL",cat:"Bas du corps",rom:0.15,metric:"mcv",ecc:true,mvt:0.2},
  dl:{name:"Soulevé de terre",cat:"Bas du corps",rom:0.20,metric:"mcv",floor:true,mvt:0.15},
  bench:{name:"Développé couché",cat:"Haut du corps",hide:true,rom:0.12,metric:"mcv",ecc:true,mvt:0.17},

</body>
</html>
